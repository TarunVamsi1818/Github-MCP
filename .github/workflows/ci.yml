
name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Quality and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install bandit pip-audit


      - name: Ruff lint
        run: ruff check .

      - name: Run tests and capture logs
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python -m pytest -v --tb=short \
            2>&1 | tee artifacts/pytest.log
          test_status=${PIPESTATUS[0]}
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m bandit -r src -f txt -o artifacts/bandit.txt

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: |
          pip-audit -f json -o artifacts/pip-audit.json

        
      - name: Display dependency audit findings
        if: always()
        run: |
          if [ -f artifacts/pip-audit.json ]; then
            python -m json.tool artifacts/pip-audit.json
          else
            echo "pip-audit report was not generated"
          fi

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: artifacts/
          if-no-files-found: warn

      - name: Enforce test result
        if: always() && steps.tests.outputs.exit_code != '0'
        run: exit 1

      - name: Enforce security results
        if: always() && (
          steps.bandit.outcome == 'failure' ||
          steps.audit.outcome == 'failure'
          )
        run: exit 1
